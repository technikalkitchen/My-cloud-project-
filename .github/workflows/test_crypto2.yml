name: Quick Test crypto2

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Setup crypto2
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::crypto2

      - name: Quick test BTC
        run: |
          R -e "
          library(crypto2)
          cat('=== Testing BTC 3 days ===\n')
          result <- tryCatch(
            crypto_history(coin_list='btc', start_date='20190101', end_date='20190103'),
            error = function(e) { cat('ERROR:', e\$message, '\n'); NULL }
          )
          if (!is.null(result)) {
            print(result[, c('timestamp', 'circulating_supply')])
            cat('SUCCESS\n')
          } else {
            cat('FAILED\n')
          }
          "
