name: Test crypto2 Historical Supply

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install crypto2
        run: |
          R -e "install.packages('crypto2', repos='https://cloud.r-project.org')"

      - name: Test LINK (ERC-20) historical supply
        run: |
          R -e "
          library(crypto2)
          cat('=== Testing LINK from 2019-01-01 to 2019-01-10 ===\n')
          link_data <- crypto_history(coin_list = 'link', start_date = '20190101', end_date = '20190110')
          print(link_data[, c('timestamp', 'circulating_supply')])
          "

      - name: Test USDT (ERC-20) historical supply
        run: |
          R -e "
          library(crypto2)
          cat('=== Testing USDT from 2019-01-01 to 2019-01-10 ===\n')
          usdt_data <- crypto_history(coin_list = 'usdt', start_date = '20190101', end_date = '20190110')
          print(usdt_data[, c('timestamp', 'circulating_supply')])
          "

      - name: Test BTC (native) historical supply
        run: |
          R -e "
          library(crypto2)
          cat('=== Testing BTC from 2019-01-01 to 2019-01-10 ===\n')
          btc_data <- crypto_history(coin_list = 'btc', start_date = '20190101', end_date = '20190110')
          print(btc_data[, c('timestamp', 'circulating_supply')])
          "
