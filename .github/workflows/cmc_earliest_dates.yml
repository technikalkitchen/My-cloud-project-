name: CMC Earliest Available Dates - All 125

on:
  workflow_dispatch:

jobs:
  find_earliest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Fetch CMC top 200 list
        run: |
          python <<'PY'
          import requests
          import json

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://coinmarketcap.com/",
              "Origin": "https://coinmarketcap.com",
          }

          print("=== Fetching CMC list ===")
          all_coins = {}
          for start in [1, 101]:
              params = {
                  "start": str(start),
                  "limit": "100",
                  "sortBy": "market_cap",
                  "sortType": "desc",
                  "convert": "USD",
                  "cryptoType": "all",
                  "tagType": "all",
                  "audited": "false",
                  "aux": "circulating_supply",
              }
              try:
                  r = requests.get(
                      "https://api.coinmarketcap.com/data-api/v3/cryptocurrency/listing",
                      params=params, headers=headers, timeout=20
                  )
                  print(f"  start={start}: HTTP {r.status_code}")
                  if r.status_code == 200:
                      data = r.json()
                      listings = data.get("data", {}).get("cryptoCurrencyList", [])
                      for coin in listings:
                          symbol = coin.get("symbol")
                          cmc_id = coin.get("id")
                          if symbol and cmc_id:
                              all_coins[symbol] = cmc_id
                      print(f"    got {len(listings)} coins")
              except Exception as e:
                  print(f"  ERROR: {type(e).__name__}: {e}")

          print(f"\nTotal coins fetched: {len(all_coins)}")

          with open("cmc_ids.json", "w") as f:
              json.dump(all_coins, f, indent=2)

          print("Saved to cmc_ids.json")
          PY

      - name: Find earliest available date per asset
        run: |
          python <<'PY'
          import requests
          import json
          import time

          with open("cmc_ids.json") as f:
              cmc_ids = json.load(f)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://coinmarketcap.com/",
              "Origin": "https://coinmarketcap.com",
          }

          checkpoints = [
              ("2017-01-01", 1483228800, 1483315200),
              ("2018-01-01", 1514764800, 1514851200),
              ("2019-01-01", 1546300800, 1546387200),
              ("2020-01-01", 1577836800, 1577923200),
              ("2021-01-01", 1609459200, 1609545600),
              ("2022-01-01", 1640995200, 1641081600),
              ("2023-01-01", 1672531200, 1672617600),
              ("2024-01-01", 1704067200, 1704153600),
          ]

          def query(cmc_id, start, end):
              params = {
                  "id": str(cmc_id),
                  "convertId": "2781",
                  "timeStart": str(start),
                  "timeEnd": str(end),
                  "interval": "1d",
              }
              try:
                  r = requests.get(
                      "https://api.coinmarketcap.com/data-api/v3/cryptocurrency/historical",
                      params=params, headers=headers, timeout=15
                  )
                  if r.status_code != 200:
                      return None
                  data = r.json()
                  if data.get("status", {}).get("error_code") != "0":
                      return None
                  quotes = data.get("data", {}).get("quotes", [])
                  if not quotes:
                      return None
                  quote = quotes[0].get("quote", {})
                  circ = quote.get("circulatingSupply")
                  return circ
              except Exception:
                  return None

          results = {}
          total = len(cmc_ids)
          print(f"=== Testing {total} assets ===\n")
          print(f"{'Symbol':<10} {'First available':<20} {'Supply (first)':<25}")
          print("-" * 60)

          for idx, (symbol, cmc_id) in enumerate(sorted(cmc_ids.items())):
              first_date = None
              first_supply = None
              for label, start, end in checkpoints:
                  circ = query(cmc_id, start, end)
                  if circ is not None:
                      first_date = label
                      first_supply = circ
                      break
                  time.sleep(0.25)

              results[symbol] = {
                  "cmc_id": cmc_id,
                  "first_date": first_date,
                  "first_supply": first_supply,
              }

              supply_str = f"{first_supply:,.0f}" if isinstance(first_supply, (int, float)) else str(first_supply)
              print(f"{symbol:<10} {first_date or 'NONE':<20} {supply_str:<25}")

              if (idx + 1) % 20 == 0:
                  print(f"  --- {idx+1}/{total} done ---")

          with open("earliest_dates.json", "w") as f:
              json.dump(results, f, indent=2)

          found = sum(1 for r in results.values() if r["first_date"])
          print(f"\n=== Summary ===")
          print(f"Assets with data: {found} / {total}")
          print(f"Assets with no data: {total - found}")

          from collections import Counter
          year_counts = Counter()
          for r in results.values():
              if r["first_date"]:
                  year_counts[r["first_date"][:4]] += 1
          print(f"\nBy earliest year:")
          for year in sorted(year_counts.keys()):
              print(f"  {year}: {year_counts[year]} assets")

          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: earliest-dates
          path: |
            cmc_ids.json
            earliest_dates.json
          retention-days: 30
