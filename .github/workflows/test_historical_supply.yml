name: Test Historical Supply via Public RPC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Test historical totalSupply via public Ethereum RPC
        run: |
          python <<'PY'
          import requests
          import time

          RPCS = [
              "https://cloudflare-eth.com",
              "https://eth.llamarpc.com",
              "https://rpc.ankr.com/eth",
              "https://ethereum.publicnode.com",
              "https://eth.drpc.org",
              "https://1rpc.io/eth",
          ]

          tokens = {
              "LINK":  {"addr": "0x514910771AF9Ca656af840dff83E8264EcF986CA", "decimals": 18},
              "UNI":   {"addr": "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984", "decimals": 18},
              "USDT":  {"addr": "0xdAC17F958D2ee523a2206206994597C13D831ec7", "decimals": 6},
              "MATIC": {"addr": "0x7D1AfA7B718fb893dB30A3aBc0Cfc608AaCfeBB0", "decimals": 18},
          }

          blocks = {
              "2020-01-01": 9193266,
              "2021-01-01": 11565020,
              "2024-01-01": 18908800,
          }

          selector = "0x18160ddd"

          def rpc_call(method, params):
              last_error = "no RPC tried"
              for url in RPCS:
                  try:
                      payload = {"jsonrpc": "2.0", "method": method, "params": params, "id": 1}
                      r = requests.post(url, json=payload, timeout=15)
                      if r.status_code != 200:
                          last_error = f"HTTP {r.status_code}"
                          continue
                      data = r.json()
                      if "error" in data:
                          last_error = f"API error: {data['error']}"
                          continue
                      result = data.get("result")
                      if isinstance(result, str) and result.startswith("0x") and len(result) > 2:
                          return result, url
                      last_error = f"bad result: {type(result).__name__}"
                  except Exception as e:
                      last_error = f"{type(e).__name__}: {str(e)[:60]}"
                      continue
              return None, last_error

          print("=== RPC Connectivity Test ===")
          block_hex, info = rpc_call("eth_blockNumber", [])
          if block_hex:
              print(f"OK: current block = {int(block_hex, 16):,}")
          else:
              print(f"FAILED: {info}")

          for symbol, info in tokens.items():
              print(f"\n=== {symbol} ===")
              values = []
              for date, block in blocks.items():
                  result, rpc_or_err = rpc_call(
                      "eth_call",
                      [{"to": info["addr"], "data": selector}, hex(block)]
                  )
                  if result:
                      try:
                          raw = int(result, 16)
                          human = raw / (10 ** info["decimals"])
                          values.append(human)
                          host = rpc_or_err.split("//")[1].split("/")[0]
                          print(f"  {date}: {human:,.2f}  [{host}]")
                      except Exception as e:
                          print(f"  {date}: parse error: {e}")
                  else:
                      print(f"  {date}: NO DATA ({rpc_or_err})")
                  time.sleep(0.5)

              if len(values) >= 2 and len(set(values)) == 1:
                  print(f"  >>> FIXED across blocks")
              elif len(values) >= 2:
                  print(f"  >>> VARIES (min={min(values):,.2f}, max={max(values):,.2f})")

          print("\n=== Done ===")
          PY
