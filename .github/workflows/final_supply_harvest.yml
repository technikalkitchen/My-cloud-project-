              "Accept": "application/json",
              "Referer": "https://coinmarketcap.com/",
          }

          # تاریخ‌های استراتژیک برای پیدا کردن اولین تاریخ عرضه
          checkpoints = [
              ("2017-01-01", 1483228800, 1483315200),
              ("2018-01-01", 1514764800, 1514851200),
              ("2019-01-01", 1546300800, 1546387200),
              ("2020-01-01", 1577836800, 1577923200),
              ("2021-01-01", 1609459200, 1609545600),
              ("2022-01-01", 1640995200, 1641081600),
              ("2023-01-01", 1672531200, 1672617600),
              ("2024-01-01", 1704067200, 1704153600),
              ("2024-07-01", 1719792000, 1719878400),
              ("2025-01-01", 1735689600, 1735776000),
              ("2025-07-01", 1751328000, 1751414400),
              ("2026-01-01", 1767225600, 1767312000)
          ]

          def query_cmc(cmc_id, start, end):
              params = {"id": str(cmc_id), "convertId": "2781", "timeStart": str(start), "timeEnd": str(end), "interval": "1d"}
              try:
                  r = requests.get("https://api.coinmarketcap.com/data-api/v3/cryptocurrency/historical", params=params, headers=headers, timeout=15)
                  if r.status_code == 200:
                      data = r.json()
                      if data.get("status", {}).get("error_code") == "0":
                          quotes = data.get("data", {}).get("quotes", [])
                          if quotes:
                              circ = quotes[0].get("quote", {}).get("circulatingSupply")
                              if circ and circ > 0:
                                  return circ
              except Exception:
                  pass
              return None

          results = []
          print(f"Starting harvest for {len(assets)} assets...\n")

          for idx, asset in enumerate(assets):
              sym = asset["symbol"]
              cmc_id = asset["cmc_id"]
              
              found_date = None
              found_supply = None

              for label, start, end in checkpoints:
                  circ = query_cmc(cmc_id, start, end)
                  if circ is not None:
                      found_date = label
                      found_supply = circ
                      break
                  time.sleep(0.4) # جلوگیری از بلاک شدن
              
              if found_date:
                  print(f"[{idx+1}/125] {sym:<10} FOUND at {found_date}")
                  results.append({
                      "symbol": sym,
                      "cmc_id": cmc_id,
                      "status": "FILLED",
                      "available_from": found_date,
                      "first_supply": found_supply
                  })
              else:
                  print(f"[{idx+1}/125] {sym:<10} NO_DATA (Even with ID)")
                  results.append({
                      "symbol": sym,
                      "cmc_id": cmc_id,
                      "status": "NO_DATA"
                  })

          with open("final_125_supply.json", "w") as f:
              json.dump(results, f, indent=2, ensure_ascii=False)

          print("\n" + "=" * 50)
          filled = sum(1 for r in results if r["status"] == "FILLED")
          print(f"FINAL RESULT: {filled} / 125 assets successfully harvested.")

          PY

      - name: Upload artifact
